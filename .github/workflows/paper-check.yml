name: Manuscript infrastructure checks
"on":
  push:
    paths: ['AGENTS.md', '.agents/skills/paper-sync/**', 'scripts/*paper*', 'scripts/check_sync_readiness.py', 'tests/test_paper*.py', 'envs/*paper*', 'docs/PAPER_WORKFLOW.md', '.github/workflows/paper-check.yml']
  pull_request:
    paths: ['AGENTS.md', '.agents/skills/paper-sync/**', 'scripts/*paper*', 'scripts/check_sync_readiness.py', 'tests/test_paper*.py', 'envs/*paper*', 'docs/PAPER_WORKFLOW.md', '.github/workflows/paper-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r envs/requirements-paper-check.txt
      - run: python scripts/check_paper.py --infrastructure-only
      - run: python -m unittest discover -s tests -p 'test_paper*.py' -v
      - run: python scripts/check_sync_readiness.py
      - run: echo 'Private manuscript checks run locally; this workflow does not publish or validate the unpublished manuscript.'
